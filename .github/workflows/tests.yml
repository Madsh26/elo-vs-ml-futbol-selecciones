name: frozen-study-integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify_final_evaluation.py --check-only --require-tag
      - run: python tools/verify_data.py --history-only
      - name: Mostrar recuento de pruebas y omisiones
        if: always()
        run: echo "La publicación solo verifica integridad. No entrena modelos, calcula predicciones ni cambia métricas."
